[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-qr-reader"
version = "1.0.0"
description = "Leitor de QR Code de WiFi com visualização da câmera em tempo real"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "See LICENSE" }
authors = [{ name = "MarbleCeo", email = "marbleceo@github.com" }]
keywords = ["wifi", "qr", "code", "scanner", "network", "camera"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "opencv-python>=4.6.0",
    "PyQt5>=5.15.0",
    "pyzbar>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/MarbleLabs1/wifi-qr-reader"
"Bug Reports" = "https://github.com/MarbleLabs1/wifi-qr-reader/issues"
Source = "https://github.com/MarbleLabs1/wifi-qr-reader"

[project.scripts]
wifi-qr-reader = "wifi_qr_reader:main"

[tool.setuptools.packages.find]
include = ["wifi_qr_reader*"]
